    async function initApp() {
      if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) {
        try {
          const res = await fetch(APPS_SCRIPT_URL);
          const json = await res.json();
          if (json && json.masterStore) {
            DB = json;
            const badge = document.getElementById("dataSourceBadge");
            badge.textContent = "● Live Google Sheets (H-1)";
            badge.className = "hidden md:inline-flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/30";
          }
        } catch (err) {
          console.error("Gagal memuat API Google Sheets, beralih ke Demo Mode:", err);
        }
      }

      setDefaultPeriodDates("THIS_MONTH_H1");
      populateRoleDropdown();
      populateRegionDropdown();
      renderActiveMenu();

    function populateRoleDropdown() {
      const sel = document.getElementById("roleSelector");
      sel.innerHTML = `<option value="LEADER">Role: Leader (All Area)</option>`;
      DB.masterUser.filter(u => u.Role === "ERO").forEach(u => {
        sel.innerHTML += `<option value="${u.Sales_Code}">Role: ERO - ${u.ERO_Name} (${u.Store_Code})</option>`;
      });
    }

    function formatDateISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function setDefaultPeriodDates(preset) {
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);

      let start, end;
      if (preset === "THIS_MONTH_H1") {
        start = new Date(yesterday.getFullYear(), yesterday.getMonth(), 1);
        end = yesterday;
      } else if (preset === "LAST_MONTH") {
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end = new Date(today.getFullYear(), today.getMonth(), 0);
      } else if (preset === "THIS_WEEK") {
        const dayOfWeek = yesterday.getDay() || 7;
        start = new Date(yesterday);
        start.setDate(yesterday.getDate() - dayOfWeek + 1);
        end = yesterday;
      } else if (preset === "YESTERDAY") {
        start = yesterday;
        end = yesterday;
      } else {
        return;
      }

      document.getElementById("dateStart").value = formatDateISO(start);
      document.getElementById("dateEnd").value = formatDateISO(end);
    }

    function onPeriodPresetChange() {
      const preset = document.getElementById("filterPeriod").value;
      if (preset !== "CUSTOM") setDefaultPeriodDates(preset);
      renderActiveMenu();
    }

    function onCustomDateChange() {
      document.getElementById("filterPeriod").value = "CUSTOM";
      renderActiveMenu();
    }

    function calcEstimationPct(actual, target, endDateStr) {
      if (!target || target <= 0) return 0;
      const endObj = new Date(endDateStr + "T00:00:00");
      const totalDaysInMonth = new Date(endObj.getFullYear(), endObj.getMonth() + 1, 0).getDate();
      const elapsedDaysH1 = Math.max(1, endObj.getDate());
      const projected = (actual / elapsedDaysH1) * totalDaysInMonth;
      return (projected / target) * 100;
    }

    function getActiveMonthKey() {
      const endStr = document.getElementById("dateEnd").value;
      return endStr ? endStr.slice(0, 7) : "2026-11";
    }

    function handleRoleChange() {
      const roleVal = document.getElementById("roleSelector").value;
      const regSel = document.getElementById("filterRegion");
      const areaSel = document.getElementById("filterArea");
      const storeSel = document.getElementById("filterStore");

      if (roleVal === "LEADER") {
        regSel.disabled = false;
        areaSel.disabled = false;
        storeSel.disabled = false;
        populateRegionDropdown();
      } else {
        const user = DB.masterUser.find(u => u.Sales_Code === roleVal);
        const store = DB.masterStore.find(s => s.Store_Code === user?.Store_Code);
        if (store) {
          populateRegionDropdown();
          regSel.value = store.Region;
          onRegionChange(false);
          areaSel.value = store.Area_TSH;
          onAreaChange(false);
          storeSel.value = store.Store_Code;

          regSel.disabled = true;
          areaSel.disabled = true;
          storeSel.disabled = true;
        }
      }
      renderActiveMenu();
    }

    function populateRegionDropdown() {
      const regSel = document.getElementById("filterRegion");
      const regions = [...new Set(DB.masterStore.map(s => s.Region))];
      regSel.innerHTML = `<option value="ALL">All Region</option>` +
        regions.map(r => `<option value="${r}">${r}</option>`).join("");
      onRegionChange(false);
    }

    function onRegionChange(triggerRender = true) {
      const reg = document.getElementById("filterRegion").value;
      const areaSel = document.getElementById("filterArea");
      const filteredStores = reg === "ALL" ? DB.masterStore : DB.masterStore.filter(s => s.Region === reg);
      const areas = [...new Set(filteredStores.map(s => s.Area_TSH))];

      areaSel.innerHTML = `<option value="ALL">All Area / TSH</option>` +
        areas.map(a => `<option value="${a}">${a}</option>`).join("");
      onAreaChange(triggerRender);
    }

    function onAreaChange(triggerRender = true) {
      const reg = document.getElementById("filterRegion").value;
      const area = document.getElementById("filterArea").value;
      const storeSel = document.getElementById("filterStore");

      let stores = DB.masterStore;
      if (reg !== "ALL") stores = stores.filter(s => s.Region === reg);
      if (area !== "ALL") stores = stores.filter(s => s.Area_TSH === area);

      storeSel.innerHTML = `<option value="ALL">All Stores (${stores.length})</option>` +
        stores.map(s => `<option value="${s.Store_Code}">${s.Store_Name} (${s.Store_Code})</option>`).join("");
      if (triggerRender) renderActiveMenu();
    }

    function setDisplayMode(mode) {
      displayMode = mode;
      const btnVal = document.getElementById("btnModeVal");
      const btnQty = document.getElementById("btnModeQty");
      if (mode === "VAL") {
        btnVal.className = "py-1.5 text-xs font-bold rounded-md bg-sky-500 text-slate-950 transition";
        btnQty.className = "py-1.5 text-xs font-bold rounded-md text-slate-400 hover:text-white transition";
      } else {
        btnQty.className = "py-1.5 text-xs font-bold rounded-md bg-sky-500 text-slate-950 transition";
        btnVal.className = "py-1.5 text-xs font-bold rounded-md text-slate-400 hover:text-white transition";
      }
      renderActiveMenu();
    }

    function switchMenu(menu) {
      activeMenu = menu;
      ["dashboard", "ero", "brand", "fokus"].forEach(m => {
        const el = document.getElementById(`nav-${m}`);
        el.className = m === menu
          ? "py-5 px-2 hover:text-white transition nav-active"
          : "py-5 px-2 hover:text-white transition";
      });
      renderActiveMenu();
    }

    function fmtRp(num) {
      if (!num) return "Rp 0";
      if (num >= 1000000000) return "Rp " + (num / 1000000000).toFixed(2) + "M";
      if (num >= 1000000) return "Rp " + (num / 1000000).toFixed(1) + "Jt";
      return "Rp " + Number(num).toLocaleString("id-ID");
    }

    function fmtQty(num) {
      return `${Number(num || 0).toLocaleString("id-ID")} Unit`;
    }

    function pctBadge(pct) {
      const val = pct.toFixed(1);
      if (pct >= 100) return `<span class="text-emerald-400 font-bold">${val}% ●</span>`;
      if (pct >= 80) return `<span class="text-amber-400 font-bold">${val}% ●</span>`;
      return `<span class="text-rose-400 font-bold">${val}% ●</span>`;
    }

    function getFilteredContext() {
      const reg = document.getElementById("filterRegion").value;
      const area = document.getElementById("filterArea").value;
      const storeCode = document.getElementById("filterStore").value;
      const start = document.getElementById("dateStart").value;
      const end = document.getElementById("dateEnd").value;
      const roleVal = document.getElementById("roleSelector").value;

      let stores = DB.masterStore;
      if (reg !== "ALL") stores = stores.filter(s => s.Region === reg);
      if (area !== "ALL") stores = stores.filter(s => s.Area_TSH === area);
      if (storeCode !== "ALL") stores = stores.filter(s => s.Store_Code === storeCode);

      const allowedStoreCodes = new Set(stores.map(s => s.Store_Code));

      let tx = DB.transaksi.filter(t => allowedStoreCodes.has(t.Store_Code) && t.Tanggal >= start && t.Tanggal <= end);
      let ti = DB.tradeIn.filter(t => allowedStoreCodes.has(t.Store_Code) && t.Tanggal >= start && t.Tanggal <= end);

      if (roleVal !== "LEADER") {
        tx = tx.filter(t => t.Sales_Code === roleVal);
        ti = ti.filter(t => t.Sales_Code === roleVal);
      }

      return { stores, allowedStoreCodes, tx, ti, start, end, roleVal, monthKey: getActiveMonthKey() };
    }

    function destroyCharts() {
      activeCharts.forEach(c => c.destroy());
      activeCharts = [];
    }

    function renderActiveMenu() {
      destroyCharts();
      const container = document.getElementById("appContainer");
      const ctx = getFilteredContext();

      if (activeMenu === "dashboard") renderDashboardMenu(container, ctx);
      else if (activeMenu === "ero") renderEroMenu(container, ctx);
      else if (activeMenu === "brand") renderBrandMenu(container, ctx);
      else if (activeMenu === "fokus") renderFokusMenu(container, ctx);
    }

      const bolTx = ctx.tx.filter(t => t.Kategori === "Boltech");
      const isatTx = ctx.tx.filter(t => t.Kategori === "Indosat");
      const tselTx = ctx.tx.filter(t => t.Kategori === "Telkomsel");

            <div class="text-xs text-slate-400 mt-1">Target Bulanan: <span class="text-slate-200 font-semibold">${fmtRp(tgt.SalesAll_Val)}</span></div>
          </div>

          <div class="card-panel rounded-xl p-5">

              <thead>
                <tr class="border-b border-slate-800 text-slate-400 text-[11px] uppercase">

            y: { ticks: { color: "#94a3b8" }, grid: { color: "#1e293b" } }
          }
        }

      activeCharts.push(chart);

      const eros = DB.masterUser.filter(u => u.Role === "ERO" && ctx.allowedStoreCodes.has(u.Store_Code));
      const ranking = eros.map(u => {
        const store = DB.masterStore.find(s => s.Store_Code === u.Store_Code) || {};
        const uTx = ctx.tx.filter(t => t.Sales_Code === u.Sales_Code);
        const uTi = ctx.ti.filter(t => t.Sales_Code === u.Sales_Code);
        const tgt = DB.targetEro.find(t => t.Sales_Code === u.Sales_Code && t.Bulan === ctx.monthKey) || {};

        const salesVal = uTx.reduce((a, b) => a + Number(b.Value || 0), 0);
        const salesQty = uTx.reduce((a, b) => a + Number(b.Qty || 0), 0);

        const acc = uTx.filter(t => t.Kategori === "Acc");

        const tiQty = uTi.reduce((a, b) => a + Number(b.Qty || 0), 0);

          region: store.Region || "-",
          salesVal, salesQty,
          devVal: dev.reduce((a, b) => a + Number(b.Value || 0), 0),
          devQty: dev.reduce((a, b) => a + Number(b.Qty || 0), 0),

    function renderBrandMenu(container, ctx) {
      const brands = [...new Set([...ctx.tx.map(t => t.Brand), ...ctx.ti.map(t => t.Brand)].filter(Boolean))];

        const bTx = ctx.tx.filter(t => t.Brand === b);

        const metric = (arr) => arr.reduce((sum, item) => sum + Number(displayMode === "VAL" ? item.Value : item.Qty || 0), 0);

        const sales = metric(bTx);
        const share = totalAll > 0 ? (sales / totalAll) * 100 : 0;

        return {
          brand: b,
          sales,
          share,
          dev: metric(bTx.filter(t => t.Kategori === "Device")),
          acc: metric(bTx.filter(t => t.Kategori === "Acc")),
          bol: metric(bTx.filter(t => t.Kategori === "Boltech")),

                    <td class="py-3 px-2 text-right">${fmtMetric(r.op)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;

      const chart = new Chart(document.getElementById("chartBrandDonut"), {
        type: "doughnut",
        data: {
          labels: brandRows.map(r => r.brand),
          datasets: [{
            data: brandRows.map(r => r.sales),
            backgroundColor: ["#38bdf8", "#10b981", "#8b5cf6", "#f59e0b", "#f43f5e", "#06b6d4"],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: "bottom", labels: { color: "#cbd5e1", boxWidth: 12 } } }
        }
      });
      activeCharts.push(chart);
    }

    function renderFokusMenu(container, ctx) {
      const activeModels = DB.masterFokus.filter(m => String(m.Status_Fokus).toUpperCase() === "AKTIF");
      const activeModelNames = new Set(activeModels.map(m => m.Nama_Model));

      const fokusTx = ctx.tx.filter(t => t.Kategori === "Device" && activeModelNames.has(t.Nama_Model));
      const totalFokusQty = fokusTx.reduce((a, b) => a + Number(b.Qty || 0), 0);
      const totalFokusVal = fokusTx.reduce((a, b) => a + Number(b.Value || 0), 0);

      const eros = DB.masterUser.filter(u => u.Role === "ERO" && ctx.allowedStoreCodes.has(u.Store_Code));
      const allowedEroCodes = new Set(eros.map(u => u.Sales_Code));
      let totalTargetFokusQty = 0;
      DB.targetEro.filter(t => allowedEroCodes.has(t.Sales_Code) && t.Bulan === ctx.monthKey).forEach(r => {
        if (ctx.roleVal === "LEADER" || r.Sales_Code === ctx.roleVal) {
          totalTargetFokusQty += Number(r.Fokus_Qty || 0);
        }
      });

      const achPct = totalTargetFokusQty > 0 ? (totalFokusQty / totalTargetFokusQty) * 100 : 0;
      const estPct = calcEstimationPct(totalFokusQty, totalTargetFokusQty, ctx.end);

      const modelBreakdown = activeModels.map(m => {
        const mTx = fokusTx.filter(t => t.Nama_Model === m.Nama_Model);
        return {
          model: m.Nama_Model,
          qty: mTx.reduce((a, b) => a + Number(b.Qty || 0), 0),
          val: mTx.reduce((a, b) => a + Number(b.Value || 0), 0)
        };
      });

      const eroFokusList = eros.map(u => {
        const store = DB.masterStore.find(s => s.Store_Code === u.Store_Code) || {};
        const uTx = fokusTx.filter(t => t.Sales_Code === u.Sales_Code);
        const tgt = DB.targetEro.find(t => t.Sales_Code === u.Sales_Code && t.Bulan === ctx.monthKey) || {};
        const qty = uTx.reduce((a, b) => a + Number(b.Qty || 0), 0);
        const val = uTx.reduce((a, b) => a + Number(b.Value || 0), 0);
        const tgtQty = Number(tgt.Fokus_Qty || 0);
        return {
          ...u,
          storeName: store.Store_Name || u.Store_Code,
          area: store.Area_TSH || "-",
          qty, val, tgtQty,
          ach: tgtQty > 0 ? (qty / tgtQty) * 100 : 0,
          est: calcEstimationPct(qty, tgtQty, ctx.end)
        };
      }).sort((a, b) => b.qty - a.qty);

      container.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-lg font-bold text-white tracking-wide">MONITORING PRODUK FOKUS (HERO PRODUCT)</h2>
          <span class="text-xs px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-300">
            Model Aktif Backend: <strong>${activeModels.map(m => m.Nama_Model).join(", ") || "Belum diset"}</strong>
          </span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="card-panel rounded-xl p-5">
            <div class="text-xs text-slate-400 font-semibold uppercase">Actual Produk Fokus</div>
            <div class="text-3xl font-extrabold text-white mt-2">${fmtQty(totalFokusQty)}</div>
            <div class="text-xs text-sky-400 font-semibold mt-1">Nilai Omzet: ${fmtRp(totalFokusVal)}</div>
          </div>
          <div class="card-panel rounded-xl p-5">
            <div class="text-xs text-slate-400 font-semibold uppercase">Target & % Achievement</div>
            <div class="text-3xl font-extrabold text-sky-400 mt-2">${achPct.toFixed(1)}%</div>
            <div class="text-xs text-slate-400 mt-1">Target Fokus: <strong class="text-white">${fmtQty(totalTargetFokusQty)}</strong></div>
          </div>
          <div class="card-panel rounded-xl p-5">
            <div class="text-xs text-slate-400 font-semibold uppercase">Estimasi Closing Bulan (H-1)</div>
            <div class="text-3xl font-extrabold mt-2 ${estPct >= 100 ? 'text-emerald-400' : 'text-amber-400'}">${estPct.toFixed(1)}% Est.</div>
            <div class="text-xs text-slate-400 mt-1">Model non-fokus otomatis tersaring keluar</div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div class="card-panel rounded-xl p-5 lg:col-span-4">
            <h3 class="text-sm font-bold text-white uppercase mb-4">Kontribusi per Model Fokus</h3>
            <div class="space-y-3">
              ${modelBreakdown.map(m => `
                <div class="p-3 rounded-lg bg-[#080f1e] border border-slate-800 flex items-center justify-between">
                  <div>
                    <div class="text-sm font-bold text-white">${m.model}</div>
                    <div class="text-xs text-slate-400">${fmtRp(m.val)}</div>
                  </div>
                  <div class="text-base font-extrabold text-sky-400">${fmtQty(m.qty)}</div>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="card-panel rounded-xl p-5 lg:col-span-8 overflow-x-auto">
            <h3 class="text-sm font-bold text-white uppercase mb-4">Pencapaian Produk Fokus per ERO</h3>
            <table class="w-full text-left text-xs sm:text-sm whitespace-nowrap">
              <thead>
                <tr class="border-b border-slate-800 text-slate-400 text-[11px] uppercase">
                  <th class="py-2.5 px-2">Rank</th>
                  <th class="py-2.5 px-2">ERO Name</th>
                  <th class="py-2.5 px-2">Store & Area</th>
                  <th class="py-2.5 px-2 text-right">Actual Qty</th>
                  <th class="py-2.5 px-2 text-right">Target Qty</th>
                  <th class="py-2.5 px-2 text-right">% Ach</th>
                  <th class="py-2.5 px-2 text-right">Est. Closing</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60">
                ${eroFokusList.map((r, i) => `
                  <tr class="hover:bg-slate-800/30">
                    <td class="py-3 px-2 font-extrabold text-sky-400">#${i + 1}</td>
                    <td class="py-3 px-2 font-bold text-white">${r.ERO_Name} <span class="text-xs text-slate-400">(${r.Sales_Code})</span></td>
                    <td class="py-3 px-2 text-xs text-slate-300">${r.storeName} • ${r.area}</td>
                    <td class="py-3 px-2 text-right font-extrabold text-white">${fmtQty(r.qty)}</td>
                    <td class="py-3 px-2 text-right text-slate-300">${fmtQty(r.tgtQty)}</td>
                    <td class="py-3 px-2 text-right">${pctBadge(r.ach)}</td>
                    <td class="py-3 px-2 text-right">${pctBadge(r.est)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    initApp();
  </script>
</body>
</html>
